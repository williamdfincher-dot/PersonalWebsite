{% assign posts = site.posts %}
{% if include.limit %}{% assign posts = site.posts | slice: 0, include.limit %}{% endif %}
{% if posts.size > 0 %}
<ul class="posts">
  {% for post in posts %}
  <li><span class="date">{{ post.date | date: '%Y-%m-%d' }}</span> <a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No posts yet.</p>
{% endif %}
