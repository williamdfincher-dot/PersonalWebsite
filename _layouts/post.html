---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="kicker"><a href="{{ '/blog/' | relative_url }}">← Blog</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
      {% assign words = content | number_of_words %}
      · {{ words | divided_by: 220 | plus: 1 }} min read
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
