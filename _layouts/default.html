<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% for item in site.nav %}{% if item.url != '/' %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endif %}{% endfor %}
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
